[workspace]

[package]
name = "quasar-audio-example-basic"
version = "0.1.0"
edition = "2021"
description = "Quasar spatial audio debug visualization demo (based on Helio indoor_cathedral)"

[dependencies]
quasar-audio = { path = "../../crates/quasar" }
quasar-core = { path = "../../crates/quasar-core" }
quasar-materials = { path = "../../crates/quasar-materials" }
quasar-dsp = { path = "../../crates/quasar-dsp" }
quasar-backends = { path = "../../crates/quasar-backends", features = ["cpu-simd"] }

helio =                    { path = "C:/Users/redst/Documents/GitHub/Pulsar-Native/crates/renderer/helio/crates/helio", features = ["bake"] }
helio-core =               { path = "C:/Users/redst/Documents/GitHub/Pulsar-Native/crates/renderer/helio/crates/helio-core" }
libhelio =                 { path = "C:/Users/redst/Documents/GitHub/Pulsar-Native/crates/renderer/helio/crates/libhelio" }
helio-default-graphs =     { path = "C:/Users/redst/Documents/GitHub/Pulsar-Native/crates/renderer/helio/crates/helio-default-graphs" }
helio-pass-perf-overlay =  { path = "C:/Users/redst/Documents/GitHub/Pulsar-Native/crates/renderer/helio/crates/passes/3d/helio-pass-perf-overlay" }
helio-pass-debug-overlay = { path = "C:/Users/redst/Documents/GitHub/Pulsar-Native/crates/renderer/helio/crates/passes/3d/helio-pass-debug-overlay" }
helio-pass-postprocess = { path = "C:/Users/redst/Documents/GitHub/Pulsar-Native/crates/renderer/helio/crates/passes/3d/helio-pass-postprocess" }
helio-pass-billboard = { path = "C:/Users/redst/Documents/GitHub/Pulsar-Native/crates/renderer/helio/crates/passes/3d/helio-pass-billboard" }

wgpu = "30"
glam = { version = "0.33", features = ["bytemuck"] }
bytemuck = { version = "1", features = ["derive"] }
winit = { version = "0.30.12", default-features = false, features = ["rwh_06"] }
pollster = "0.4"
log = "0.4"
env_logger = "0.11"
