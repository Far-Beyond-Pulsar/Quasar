[package]
name = "quasar-backends"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Quasar acoustic compute backends: CPU SIMD, WGPU, HW accelerator stub"

[dependencies]
quasar-core = { workspace = true }
quasar-materials = { workspace = true }
rayon = { workspace = true, optional = true }
bytemuck = { workspace = true, optional = true }
wgpu = { version = "24", default-features = false, features = ["wgsl", "dx12", "metal", "vulkan-portability"], optional = true }

[features]
default = ["cpu-simd"]
cpu-simd = ["rayon"]
# wgpu-compute reuses the CPU backend's scene preprocessing (mirror planes, room statistics) and
# its shared occlusion / reflection / late-reverb code, hence the cpu-simd dependency.
wgpu-compute = ["bytemuck", "wgpu", "cpu-simd"]

[lib]
